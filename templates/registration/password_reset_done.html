<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Email | SiteWatch</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(245,158,11,.10), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(6,182,212,.08), transparent 30%),
                #070b12;
            color: #e5e7eb;
            font-family: Inter, sans-serif;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            text-align: center;
            padding: 44px;
            background: rgba(15,23,42,.88);
            border: 1px solid rgba(148,163,184,.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0,0,0,.45);
        }

        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .logo span { color: #f59e0b; }

        .icon {
            width: 70px;
            height: 70px;
            margin: auto auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(34,197,94,.10);
            border: 1px solid rgba(34,197,94,.25);
            font-size: 30px;
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 29px;
            margin-bottom: 12px;
        }

        p {
            color: #94a3b8;
            line-height: 1.7;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 13px 22px;
            border-radius: 12px;
            background: #f59e0b;
            color: #111827;
            text-decoration: none;
            font-weight: 700;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        Site<span>Watch</span>
    </div>

    <div class="icon">✓</div>

    <h1>Check your email</h1>

    <p>
        If an account exists with that email address,
        we've sent instructions to reset your password.
    </p>

    <p>
        Follow the link in the email to create your new password.
    </p>

    <a class="back" href="{% url 'login' %}">
        Back to Login
    </a>

</div>

</body>
</html>
