<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | SiteWatch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 15% 20%, rgba(245, 158, 11, 0.10), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.08), transparent 30%),
                #070b12;
            color: #e5e7eb;
            font-family: "Inter", sans-serif;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            padding: 42px;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(18px);
        }

        .logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 27px;
            font-weight: 700;
            margin-bottom: 32px;
        }

        .logo span {
            color: #f59e0b;
        }

        .icon {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            background: rgba(245, 158, 11, 0.10);
            border: 1px solid rgba(245, 158, 11, 0.20);
            font-size: 25px;
            margin-bottom: 22px;
        }

        h1 {
            font-family: "Space Grotesk", sans-serif;
            font-size: 30px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        form p {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid #263244;
            background: #0b1220;
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.10);
        }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #f59e0b;
            color: #111827;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            transform: translateY(-1px);
            filter: brightness(1.08);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 24px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #f59e0b;
        }

        .help {
            font-size: 12px;
            color: #64748b;
            margin-top: 8px;
        }

        ul.errorlist {
            color: #f87171;
            padding-left: 18px;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        Site<span>Watch</span>
    </div>

    <div class="icon">🔐</div>

    <h1>Reset your password</h1>

    <p class="subtitle">
        Enter the email associated with your SiteWatch account
        and we'll help you regain access.
    </p>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <a class="back" href="{% url 'login' %}">
        ← Back to Login
    </a>

</div>

</body>
</html>
